# LED Vision Lab — Synthetic Dataset Config v2
# Generate: uv run python scripts/generate_dataset.py

seed: 42
total: 100
master_size: 512          # all rendering at 512×512, then downsampled
image_format: jpg
image_quality: 95

# Export resolutions (downsampled from master)
export_sizes:
  - 64
  - 128
  - 224
  - 256

output_dir: data/generated

# ──────────────────────────────────────────────
# Class balance preset
#   balanced        → 50 % ON / 50 % OFF
#   imbalanced_80_20→ 80 % ON / 20 % OFF
#   imbalanced_95_5 → 95 % ON / 5 %  OFF
#   rare_fault      →  5 % ON / 95 % OFF
# ──────────────────────────────────────────────
class_balance: balanced

split:
  train: 0.70
  val:   0.15
  test:  0.15

# ──────────────────────────────────────────────
# LED properties
# ──────────────────────────────────────────────
led:
  colors:
    - red
    - green
    - yellow
    - blue
    - white
    - orange
    - purple
    - cyan
    - magenta
    - amber
    - warm_white
    - cool_white
    - lime_green
    - uv_violet

  shapes:
    - round
    - square
    - rectangular
    - dome
    - dome_side
    - smd

  lens_types:
    - clear
    - diffused

  brightness_range:      [0.05, 1.0]   # 0.0 = off-housing, 1.0 = full power
  size_range:            [0.04, 0.22]  # fraction of master image
  position_margin:       0.05          # minimum distance from edge
  glow_radius_range:     [0.6, 3.0]   # glow spread multiplier
  halo_intensity_range:  [0.1, 1.0]

# ──────────────────────────────────────────────
# Multi-LED scene layout weights
# ──────────────────────────────────────────────
multi_led:
  single: 0.60   # 1 LED
  two:    0.18   # 2 LEDs
  four:   0.12   # 4 LEDs
  row:    0.07   # 4 in a row
  grid:   0.03   # 2×2 grid
  mixed_states: true   # multi-LED scenes may have mixed ON/OFF

# ──────────────────────────────────────────────
# Background style weights (must sum ≈ 1.0)
# ──────────────────────────────────────────────
backgrounds:
  black_plastic:   0.09
  gray_plastic:    0.08
  white_plastic:   0.05
  dark_enclosure:  0.07
  light_enclosure: 0.06
  pcb:             0.09
  blue_pcb:        0.05
  realistic_pcb:   0.09
  metal:           0.06
  brushed_metal:   0.05
  white_studio:    0.05
  aluminum_pcb:    0.05
  textured:        0.05
  gradient:        0.05
  plain:           0.06

# ──────────────────────────────────────────────
# Ambient lighting type weights
# ──────────────────────────────────────────────
ambient:
  dark_room:     0.10
  normal_indoor: 0.35
  bright_office: 0.15
  directional:   0.15
  low_light:     0.10
  warm:          0.05
  cool:          0.05
  backlight:     0.05

# ──────────────────────────────────────────────
# Glare / reflection weights
# ──────────────────────────────────────────────
glare:
  none:               0.50
  small_highlight:    0.20
  strong_glare:       0.10
  reflection_near:    0.10
  reflection_overlap: 0.05
  glossy:             0.05

# ──────────────────────────────────────────────
# Occlusion weights
# ──────────────────────────────────────────────
occlusion:
  none:       0.75
  cable:      0.08
  label:      0.07
  shadow:     0.05
  panel_edge: 0.05

# ──────────────────────────────────────────────
# False positive injection
# ──────────────────────────────────────────────
false_positive:
  enabled: true
  rate:    0.05     # probability per OFF image
  types:
    - colored_screw
    - reflection_spot
    - printed_circle
    - colored_button
    - display_pixel
    - specular_highlight

# ──────────────────────────────────────────────
# Camera / sensor simulation
# ──────────────────────────────────────────────
camera:
  noise_sigma_range:       [0.0, 20.0]
  blur_sigma_range:        [0.0, 3.0]
  motion_blur_prob:        0.10
  motion_blur_length_range: [3, 15]
  chromatic_shift_range:   [0.0, 3.0]
  gamma_range:             [0.7, 1.5]
  white_balance_shift:     0.10
  jpeg_artifact_prob:      0.10
  jpeg_quality_range:      [60, 85]

# ──────────────────────────────────────────────
# Difficulty level weights
# ──────────────────────────────────────────────
difficulty:
  easy:    0.25
  medium:  0.35
  hard:    0.25
  extreme: 0.15

# ──────────────────────────────────────────────
# Dataset group / scenario weights
# ──────────────────────────────────────────────
groups:
  clean_easy:            0.20
  lighting_variation:    0.15
  camera_variation:      0.15
  geometry_perspective:  0.10
  glare_reflections:     0.10
  blur_noise:            0.10
  difficult_on_off:      0.10
  false_positives:       0.05
  occlusion:             0.05
