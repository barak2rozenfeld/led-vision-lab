# LED Vision Lab REST API. Relative paths are resolved against the working
# directory, so start the server from the repository root.

max_upload_bytes: 10485760        # 10 MB
max_pixels: 16000000              # ~4000 x 4000
accepted_content_types:
  - image/jpeg
  - image/png
  - image/bmp
  - image/webp
detector_config_dir: configs/detectors
dataset_stats_path: artifacts/dataset/stats.json
benchmark_path: artifacts/benchmarks/summary.json
cors_origins:                     # the Vite dev server proxies /api, so this is only for direct calls
  - http://127.0.0.1:5173
  - http://localhost:5173
